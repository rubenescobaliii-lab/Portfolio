<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#140b24"/>
      <stop offset="50%" stop-color="#220e40"/>
      <stop offset="100%" stop-color="#0b0614"/>
    </linearGradient>
    <linearGradient id="accent4" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <filter id="glow4" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <rect width="800" height="450" fill="url(#bg4)"/>
  
  <circle cx="400" cy="225" r="140" fill="rgba(168, 85, 247, 0.15)" filter="url(#glow4)"/>
  
  <!-- Hardware & Circuit Board Frame -->
  <rect x="180" y="85" width="440" height="280" rx="12" fill="#170c2c" stroke="rgba(255,255,255,0.15)" stroke-width="1.5"/>
  
  <!-- Header -->
  <path d="M 180 97 C 180 90.3 185.3 85 192 85 L 608 85 C 614.7 85 620 90.3 620 97 L 620 120 L 180 120 Z" fill="#251249"/>
  <circle cx="205" cy="102" r="5" fill="#ef4444"/>
  <circle cx="220" cy="102" r="5" fill="#f59e0b"/>
  <circle cx="235" cy="102" r="5" fill="#10b981"/>
  <text x="400" y="107" fill="#d8b4fe" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" text-anchor="middle" font-weight="500">BSCOE · Microcontroller &amp; Hardware Circuit Lab</text>
  
  <!-- Central CPU / Microcontroller Chip -->
  <g transform="translate(230, 150)">
    <rect x="0" y="0" width="160" height="150" rx="10" fill="#241442" stroke="#a855f7" stroke-width="2"/>
    <rect x="30" y="25" width="100" height="100" rx="6" fill="#120824" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
    
    <!-- Chip Pins Top & Bottom -->
    <g fill="#c084fc">
      <rect x="45" y="8" width="6" height="17"/>
      <rect x="65" y="8" width="6" height="17"/>
      <rect x="85" y="8" width="6" height="17"/>
      <rect x="105" y="8" width="6" height="17"/>
      
      <rect x="45" y="125" width="6" height="17"/>
      <rect x="65" y="125" width="6" height="17"/>
      <rect x="85" y="125" width="6" height="17"/>
      <rect x="105" y="125" width="6" height="17"/>
    </g>
    
    <!-- Chip text -->
    <text x="80" y="65" fill="#f3e8ff" font-family="monospace" font-size="11" font-weight="700" text-anchor="middle">BSCOE-4</text>
    <text x="80" y="82" fill="#c084fc" font-family="monospace" font-size="9" text-anchor="middle">ICCT LAB</text>
    <text x="80" y="100" fill="#34d399" font-family="monospace" font-size="8" text-anchor="middle">ONLINE 3.3V</text>
  </g>
  
  <!-- Real-Time Telemetry Graph -->
  <g transform="translate(415, 145)">
    <rect x="0" y="0" width="185" height="165" rx="8" fill="#1f113a" stroke="rgba(255,255,255,0.08)"/>
    <text x="15" y="25" fill="#e9d5ff" font-family="sans-serif" font-size="11" font-weight="600">Sensor Telemetry</text>
    
    <!-- Waveform / Oscilloscope line -->
    <path d="M 15 85 L 35 85 L 45 45 L 60 115 L 75 70 L 90 90 L 105 50 L 120 100 L 135 75 L 170 75" fill="none" stroke="#f472b6" stroke-width="2" stroke-linecap="round"/>
    
    <text x="15" y="125" fill="#9ca3af" font-family="monospace" font-size="10">Freq: 64.0 MHz</text>
    <text x="15" y="145" fill="#34d399" font-family="monospace" font-size="10">Signal: Synchronized</text>
  </g>
  
  <!-- Floating Badge -->
  <rect x="305" y="380" width="190" height="28" rx="14" fill="#2e1065" stroke="#c084fc" stroke-width="1.5"/>
  <text x="400" y="398" fill="#f3e8ff" font-family="monospace" font-size="11" text-anchor="middle">Computer Engineering · Hardware</text>
</svg>