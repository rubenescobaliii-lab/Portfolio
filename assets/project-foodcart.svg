<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <linearGradient id="accent1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
    <filter id="glow1" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <rect width="800" height="450" fill="url(#bg1)"/>
  
  <!-- Grid overlay -->
  <g stroke="rgba(255,255,255,0.05)" stroke-width="1">
    <line x1="0" y1="90" x2="800" y2="90"/>
    <line x1="0" y1="180" x2="800" y2="180"/>
    <line x1="0" y1="270" x2="800" y2="270"/>
    <line x1="0" y1="360" x2="800" y2="360"/>
    <line x1="160" y1="0" x2="160" y2="450"/>
    <line x1="320" y1="0" x2="320" y2="450"/>
    <line x1="480" y1="0" x2="480" y2="450"/>
    <line x1="640" y1="0" x2="640" y2="450"/>
  </g>
  
  <!-- Glowing circular backdrop -->
  <circle cx="400" cy="225" r="140" fill="rgba(245, 158, 11, 0.12)" filter="url(#glow1)"/>
  
  <!-- POS & Cart Dashboard UI Mockup -->
  <rect x="180" y="85" width="440" height="280" rx="12" fill="#111827" stroke="rgba(255,255,255,0.15)" stroke-width="1.5"/>
  
  <!-- Window Header -->
  <path d="M 180 97 C 180 90.3 185.3 85 192 85 L 608 85 C 614.7 85 620 90.3 620 97 L 620 120 L 180 120 Z" fill="#1f2937"/>
  <circle cx="205" cy="102" r="5" fill="#ef4444"/>
  <circle cx="220" cy="102" r="5" fill="#f59e0b"/>
  <circle cx="235" cy="102" r="5" fill="#10b981"/>
  <text x="400" y="107" fill="#9ca3af" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" text-anchor="middle" font-weight="500">Food Cart POS &amp; Inventory Management</text>
  
  <!-- Left Side: Order / Menu list -->
  <rect x="200" y="140" width="190" height="42" rx="6" fill="#1f2937" stroke="rgba(245, 158, 11, 0.3)" stroke-width="1"/>
  <text x="215" y="160" fill="#f3f4f6" font-family="sans-serif" font-size="12" font-weight="600">Daily Sales Tracker</text>
  <text x="215" y="174" fill="#10b981" font-family="monospace" font-size="11">+ ₱14,250.00 Today</text>
  
  <rect x="200" y="195" width="190" height="42" rx="6" fill="#1f2937" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <text x="215" y="215" fill="#e5e7eb" font-family="sans-serif" font-size="12" font-weight="600">Stock &amp; Ingredients</text>
  <text x="215" y="229" fill="#f59e0b" font-family="monospace" font-size="11">92% Restocked</text>
  
  <rect x="200" y="250" width="190" height="42" rx="6" fill="#1f2937" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <text x="215" y="270" fill="#e5e7eb" font-family="sans-serif" font-size="12" font-weight="600">Profit Margin</text>
  <text x="215" y="284" fill="#38bdf8" font-family="monospace" font-size="11">38.4% Net Margin</text>
  
  <rect x="200" y="305" width="190" height="42" rx="6" fill="url(#accent1)"/>
  <text x="295" y="331" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">Generate Daily Report</text>
  
  <!-- Right Side: Chart & Stats -->
  <rect x="410" y="140" width="190" height="207" rx="8" fill="#182234" stroke="rgba(255,255,255,0.06)"/>
  <text x="425" y="165" fill="#cbd5e1" font-family="sans-serif" font-size="12" font-weight="600">Revenue Analytics</text>
  
  <!-- Mini Bar Chart -->
  <rect x="430" y="250" width="18" height="60" rx="3" fill="#3b82f6"/>
  <rect x="460" y="220" width="18" height="90" rx="3" fill="#3b82f6"/>
  <rect x="490" y="240" width="18" height="70" rx="3" fill="#3b82f6"/>
  <rect x="520" y="190" width="18" height="120" rx="3" fill="#f59e0b"/>
  <rect x="550" y="170" width="18" height="140" rx="3" fill="#10b981"/>
  <line x1="420" y1="315" x2="585" y2="315" stroke="rgba(255,255,255,0.2)"/>
  
  <!-- Floating Badge -->
  <rect x="330" y="380" width="140" height="28" rx="14" fill="#1e1b4b" stroke="#818cf8" stroke-width="1.5"/>
  <text x="400" y="398" fill="#c7d2fe" font-family="monospace" font-size="11" text-anchor="middle">Python · JS · POS</text>
</svg>