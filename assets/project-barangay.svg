<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#061f18"/>
      <stop offset="50%" stop-color="#0b382c"/>
      <stop offset="100%" stop-color="#04120e"/>
    </linearGradient>
    <linearGradient id="accent3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="glow3" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <rect width="800" height="450" fill="url(#bg3)"/>
  
  <circle cx="400" cy="225" r="140" fill="rgba(16, 185, 129, 0.12)" filter="url(#glow3)"/>
  
  <!-- Barangay Portal Dashboard Frame -->
  <rect x="180" y="85" width="440" height="280" rx="12" fill="#08201a" stroke="rgba(255,255,255,0.15)" stroke-width="1.5"/>
  
  <!-- Header -->
  <path d="M 180 97 C 180 90.3 185.3 85 192 85 L 608 85 C 614.7 85 620 90.3 620 97 L 620 120 L 180 120 Z" fill="#0e332a"/>
  <circle cx="205" cy="102" r="5" fill="#ef4444"/>
  <circle cx="220" cy="102" r="5" fill="#f59e0b"/>
  <circle cx="235" cy="102" r="5" fill="#10b981"/>
  <text x="400" y="107" fill="#6ee7b7" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" text-anchor="middle" font-weight="500">Barangay Mambugan · Secretary &amp; Budget Portal</text>
  
  <!-- Left Side: Budget Proposal Sheet -->
  <rect x="205" y="135" width="220" height="210" rx="6" fill="#0c2d24" stroke="rgba(16, 185, 129, 0.25)" stroke-width="1"/>
  <text x="220" y="158" fill="#ecfdf5" font-family="sans-serif" font-size="12" font-weight="700">Annual Budget Proposal 2026</text>
  <text x="220" y="174" fill="#a7f3d0" font-family="monospace" font-size="10">REF: MAMB-SEC-2026-B04</text>
  
  <!-- Proposal Rows -->
  <line x1="220" y1="188" x2="410" y2="188" stroke="rgba(255,255,255,0.1)"/>
  <text x="220" y="206" fill="#9ca3af" font-family="sans-serif" font-size="11">Community Projects</text>
  <text x="410" y="206" fill="#34d399" font-family="monospace" font-size="11" text-anchor="end">₱450,000</text>
  
  <line x1="220" y1="218" x2="410" y2="218" stroke="rgba(255,255,255,0.06)"/>
  <text x="220" y="236" fill="#9ca3af" font-family="sans-serif" font-size="11">Administrative Supplies</text>
  <text x="410" y="236" fill="#34d399" font-family="monospace" font-size="11" text-anchor="end">₱85,000</text>
  
  <line x1="220" y1="248" x2="410" y2="248" stroke="rgba(255,255,255,0.06)"/>
  <text x="220" y="266" fill="#9ca3af" font-family="sans-serif" font-size="11">Disaster Preparedness</text>
  <text x="410" y="266" fill="#34d399" font-family="monospace" font-size="11" text-anchor="end">₱240,000</text>
  
  <rect x="220" y="285" width="190" height="42" rx="6" fill="url(#accent3)"/>
  <text x="315" y="311" fill="#022c22" font-family="sans-serif" font-size="12" font-weight="700" text-anchor="middle">Official Seal &amp; Approved</text>
  
  <!-- Right Side: Certificate & Document Queue -->
  <rect x="440" y="135" width="160" height="98" rx="6" fill="#0c2d24" stroke="rgba(255,255,255,0.06)"/>
  <text x="455" y="158" fill="#e2e8f0" font-family="sans-serif" font-size="11" font-weight="600">Document Queue</text>
  <rect x="455" y="172" width="130" height="20" rx="4" fill="#047857"/>
  <text x="462" y="186" fill="#ffffff" font-family="monospace" font-size="9">Clearance #1049 - Ready</text>
  <rect x="455" y="198" width="130" height="20" rx="4" fill="#134e4a"/>
  <text x="462" y="212" fill="#99f6e4" font-family="monospace" font-size="9">Residency Cert - Signed</text>
  
  <rect x="440" y="245" width="160" height="100" rx="6" fill="#0c2d24" stroke="rgba(255,255,255,0.06)"/>
  <text x="455" y="268" fill="#e2e8f0" font-family="sans-serif" font-size="11" font-weight="600">Secretary Status</text>
  <circle cx="463" cy="292" r="5" fill="#10b981"/>
  <text x="475" y="295" fill="#a7f3d0" font-family="sans-serif" font-size="10">Active Records</text>
  <text x="455" y="325" fill="#6ee7b7" font-family="monospace" font-size="13" font-weight="700">1,240+ Processed</text>
  
  <!-- Floating Badge -->
  <rect x="315" y="380" width="170" height="28" rx="14" fill="#0b382c" stroke="#34d399" stroke-width="1.5"/>
  <text x="400" y="398" fill="#a7f3d0" font-family="monospace" font-size="11" text-anchor="middle">Budget &amp; Documentation</text>
</svg>