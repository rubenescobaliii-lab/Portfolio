<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#091421"/>
      <stop offset="50%" stop-color="#0f263d"/>
      <stop offset="100%" stop-color="#050a11"/>
    </linearGradient>
    <linearGradient id="accent2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <filter id="glow2" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <rect width="800" height="450" fill="url(#bg2)"/>
  
  <circle cx="400" cy="225" r="150" fill="rgba(6, 182, 212, 0.12)" filter="url(#glow2)"/>
  
  <!-- Car Dealership Management Frame -->
  <rect x="180" y="85" width="440" height="280" rx="12" fill="#0d1b2a" stroke="rgba(255,255,255,0.15)" stroke-width="1.5"/>
  
  <!-- Header -->
  <path d="M 180 97 C 180 90.3 185.3 85 192 85 L 608 85 C 614.7 85 620 90.3 620 97 L 620 120 L 180 120 Z" fill="#1b2a41"/>
  <circle cx="205" cy="102" r="5" fill="#ef4444"/>
  <circle cx="220" cy="102" r="5" fill="#f59e0b"/>
  <circle cx="235" cy="102" r="5" fill="#10b981"/>
  <text x="400" y="107" fill="#93c5fd" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" text-anchor="middle" font-weight="500">AutoDeal · Dealership Inventory &amp; Financing</text>
  
  <!-- Car Silhouette / Graphics -->
  <g transform="translate(210, 140)">
    <rect x="0" y="0" width="380" height="90" rx="8" fill="#14213d" stroke="rgba(6, 182, 212, 0.3)" stroke-width="1"/>
    
    <!-- Stylized modern car outline -->
    <path d="M 30 55 L 60 55 L 75 35 L 140 35 L 165 55 L 210 55 C 215 55 220 60 220 65 L 220 72 L 20 72 L 20 65 C 20 60 25 55 30 55 Z" fill="none" stroke="#38bdf8" stroke-width="2.5"/>
    <!-- Wheels -->
    <circle cx="55" cy="72" r="12" fill="#0d1b2a" stroke="#06b6d4" stroke-width="2.5"/>
    <circle cx="175" cy="72" r="12" fill="#0d1b2a" stroke="#06b6d4" stroke-width="2.5"/>
    <circle cx="55" cy="72" r="4" fill="#38bdf8"/>
    <circle cx="175" cy="72" r="4" fill="#38bdf8"/>
    
    <text x="240" y="35" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="700">Vehicle Inventory</text>
    <text x="240" y="55" fill="#94a3b8" font-family="sans-serif" font-size="11">18 Units Available</text>
    <text x="240" y="72" fill="#34d399" font-family="monospace" font-size="11">● Active Sales &amp; Financing</text>
  </g>
  
  <!-- Stats & Financing Calculator Row -->
  <rect x="210" y="245" width="180" height="95" rx="8" fill="#14213d" stroke="rgba(255,255,255,0.06)"/>
  <text x="225" y="270" fill="#94a3b8" font-family="sans-serif" font-size="11" font-weight="600">Monthly Amortization</text>
  <text x="225" y="295" fill="#38bdf8" font-family="monospace" font-size="16" font-weight="700">₱ 12,450 /mo</text>
  <text x="225" y="320" fill="#64748b" font-family="sans-serif" font-size="10">36 Months Term · 20% DP</text>
  
  <rect x="410" y="245" width="180" height="95" rx="8" fill="#14213d" stroke="rgba(255,255,255,0.06)"/>
  <text x="425" y="270" fill="#94a3b8" font-family="sans-serif" font-size="11" font-weight="600">Client Agreements</text>
  <text x="425" y="295" fill="#34d399" font-family="monospace" font-size="16" font-weight="700">100% Documented</text>
  <text x="425" y="320" fill="#64748b" font-family="sans-serif" font-size="10">Deeds of Sale &amp; Transfer</text>
  
  <!-- Floating Badge -->
  <rect x="330" y="380" width="140" height="28" rx="14" fill="#0f263d" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="400" y="398" fill="#bae6fd" font-family="monospace" font-size="11" text-anchor="middle">Java · SQL · Sales</text>
</svg>